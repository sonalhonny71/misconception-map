version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: misconceptionmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/misconceptionmap?sslmode=disable
      DATABASE_URL_DIRECT: postgresql+psycopg://postgres:postgres@postgres:5432/misconceptionmap?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENV: development
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8000
      RENDER_API_KEY: ${RENDER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini

volumes:
  postgres_data: