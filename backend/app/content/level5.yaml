# Level 5: Challenge Lab — Real-World Transfer & Inequalities
items:
  - item_id: "diag-5-linear-01"
    level: 5
    skill: "transfer-inequalities"
    kind: "diagnostic"
    prompt: "If y = 3x + 2, find y when x = 4."
    options:
      - id: "opt-2"
        text: "10"
        misconception_id: "SUBST_ORDER"
        note: "3+4+2=9? or 3×2+4=10"
      - id: "opt-1"
        text: "14"
        misconception_id: null
        note: "Correct: 3×4+2=14"
      - id: "opt-3"
        text: "8"
        misconception_id: "SUBST_ORDER"
        note: "4+2=6? or 3+4=7? unclear"
      - id: "opt-4"
        text: "16"
        misconception_id: "SUBST_ORDER"
        note: "3×4=12, then 12+4=16? unclear"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Substitute x = 4: y = 3 × 4 + 2 = 12 + 2 = 14."
    discriminates: ["SUBST_ORDER"]

  - item_id: "diag-5-ineq-01"
    level: 5
    skill: "transfer-inequalities"
    kind: "diagnostic"
    prompt: "Solve 2x - 5 > 3."
    options:
      - id: "opt-2"
        text: "x < 4"
        misconception_id: "INEQ_FLIP"
        note: "Flipped sign incorrectly"
      - id: "opt-3"
        text: "x > 1"
        misconception_id: "INV_ORDER"
        note: "Subtracted 5 from 3: 2x > -2? unclear"
      - id: "opt-1"
        text: "x > 4"
        misconception_id: null
        note: "Correct: 2x > 8, x > 4"
      - id: "opt-4"
        text: "x < 1"
        misconception_id: "INV_ORDER"
        note: "Multiple errors"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Add 5 to both sides: 2x > 8. Divide by 2: x > 4. (No sign flip since dividing by positive 2.)"
    discriminates: ["INEQ_FLIP", "INV_ORDER"]

  - item_id: "diag-5-system-01"
    level: 5
    skill: "transfer-inequalities"
    kind: "diagnostic"
    prompt: "If x + y = 7 and x = 3, find y."
    options:
      - id: "opt-2"
        text: "10"
        misconception_id: "INV_WRONG_OP"
        note: "Added 3 + 7 = 10"
      - id: "opt-3"
        text: "-4"
        misconception_id: "INV_WRONG_OP"
        note: "Subtracted 7 - 3 = 4, then negative? unclear"
      - id: "opt-4"
        text: "0"
        misconception_id: "UNCLEAR"
        note: "No clear pattern"
      - id: "opt-1"
        text: "4"
        misconception_id: null
        note: "Correct: 3 + y = 7, y = 4"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Substitute x = 3: 3 + y = 7. Subtract 3 from both sides: y = 4."
    discriminates: ["INV_WRONG_OP"]

  - item_id: "diag-5-ineq-neg-01"
    level: 5
    skill: "transfer-inequalities"
    kind: "diagnostic"
    prompt: "Solve -3x > 9."
    options:
      - id: "opt-1"
        text: "x < -3"
        misconception_id: null
        note: "Correct: divide by -3, flip sign"
      - id: "opt-2"
        text: "x > -3"
        misconception_id: "INEQ_FLIP"
        note: "Did not flip sign when dividing by negative"
      - id: "opt-3"
        text: "x < 3"
        misconception_id: "INV_NEG_DIV"
        note: "Divided by 3 instead of -3, flipped sign"
      - id: "opt-4"
        text: "x > 3"
        misconception_id: "INV_NEG_DIV"
        note: "Divided by 3, no flip"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Divide both sides by -3. Since -3 is negative, flip the inequality: x < -3."
    discriminates: ["INEQ_FLIP", "INV_NEG_DIV"]

