# Level 1: Foundations — Arithmetic Principles & Integers
items:
  - item_id: "diag-1-int-01"
    level: 1
    skill: "arithmetic-integers"
    kind: "diagnostic"
    prompt: "Which comparison is correct?"
    options:
      - id: "opt-1"
        text: "-7 < 3"
        misconception_id: null
        note: "Correct: negative numbers are left of positive on number line"
      - id: "opt-2"
        text: "-7 > 3"
        misconception_id: "INT_COMPARE_ABS"
        note: "Compared absolute values: 7 > 3"
      - id: "opt-3"
        text: "-7 = 3"
        misconception_id: "UNCLEAR"
        note: "No clear pattern"
      - id: "opt-4"
        text: "|-7| < 3"
        misconception_id: "INT_COMPARE_ABS"
        note: "Absolute value 7, but 7 < 3 is false"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "On the number line, -7 is to the left of 3, so -7 < 3. Negative numbers are always less than positive numbers."
    discriminates: ["INT_COMPARE_ABS"]

  - item_id: "diag-1-int-02"
    level: 1
    skill: "arithmetic-integers"
    kind: "diagnostic"
    prompt: "Evaluate |-15|."
    options:
      - id: "opt-1"
        text: "15"
        misconception_id: null
        note: "Correct: absolute value is distance from zero"
      - id: "opt-2"
        text: "-15"
        misconception_id: "INT_COMPARE_ABS"
        note: "Carried negative sign through absolute value"
      - id: "opt-3"
        text: "0"
        misconception_id: "UNCLEAR"
        note: "No clear pattern"
      - id: "opt-4"
        text: "-|15|"
        misconception_id: "INT_COMPARE_ABS"
        note: "Confused absolute value with negative of absolute value"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Absolute value is distance from zero, so |-15| = 15. It is never negative."
    discriminates: ["INT_COMPARE_ABS"]

  - item_id: "diag-1-ops-01"
    level: 1
    skill: "arithmetic-integers"
    kind: "diagnostic"
    prompt: "Evaluate 3 + 4 × 2."
    options:
      - id: "opt-1"
        text: "14"
        misconception_id: "ORDER_OPS"
        note: "Added first: (3+4)×2 = 14"
      - id: "opt-2"
        text: "11"
        misconception_id: null
        note: "Correct: multiply first: 4×2=8, then 3+8=11"
      - id: "opt-3"
        text: "20"
        misconception_id: "UNCLEAR"
        note: "No clear pattern"
      - id: "opt-4"
        text: "5"
        misconception_id: "UNCLEAR"
        note: "No clear pattern"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-2"
    explanation: "Order of operations: multiply before add. 4 × 2 = 8, then 3 + 8 = 11."
    discriminates: ["ORDER_OPS"]

  - item_id: "diag-1-int-03"
    level: 1
    skill: "arithmetic-integers"
    kind: "diagnostic"
    prompt: "Compare -12 and -5."
    options:
      - id: "opt-1"
        text: "-12 < -5"
        misconception_id: null
        note: "Correct: -12 is further left on number line"
      - id: "opt-2"
        text: "-12 > -5"
        misconception_id: "INT_COMPARE_ABS"
        note: "Compared absolute values: 12 > 5"
      - id: "opt-3"
        text: "-12 = -5"
        misconception_id: "UNCLEAR"
        note: "No clear pattern"
      - id: "opt-4"
        text: "|-12| < |-5|"
        misconception_id: "INT_COMPARE_ABS"
        note: "Compared absolute values instead of positions"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "On the number line, -12 is to the left of -5, so -12 < -5. More negative means smaller."
    discriminates: ["INT_COMPARE_ABS"]

