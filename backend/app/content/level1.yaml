      - id: "opt-2"
        text: "-250 meters"
        misconception_id: "INT_COMPARE_ABS"
        note: "Subtracted instead of adding rise"
      - id: "opt-3"
        text: "150 meters"
        misconception_id: "INT_COMPARE_ABS"
        note: "Dropped negative sign"
      - id: "opt-4"
        text: "250 meters"
        misconception_id: "UNCLEAR"
        note: "No clear pattern"
      - id: "opt-5"
        text: "I'm not sure yet"
