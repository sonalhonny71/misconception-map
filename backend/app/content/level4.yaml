    kind: "diagnostic"
    prompt: "Solve 3x - 5 = 10."
    options:
      - id: "opt-1"
        text: "x = 5"
        misconception_id: null
        note: "Correct: add 5, divide by 3"
      - id: "opt-2"
        text: "x = 15"
        misconception_id: "INV_WRONG_OP"
        note: "Added 5 to get 3x=15, but forgot to divide by 3"
      - id: "opt-3"
        text: "x = -5"
        misconception_id: "INV_WRONG_OP"
        note: "Subtracted 5 from 10: 3x=5? unclear"
      - id: "opt-4"
        text: "x = 3"
        misconception_id: "INV_WRONG_OP"
        note: "Divided 10 by 3 first? unclear"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
