        note: "Correct: 3x-6=9, 3x=15, x=5"
      - id: "opt-2"
        text: "x = 11/3"
        misconception_id: "DIST_PARTIAL"
        note: "From 3x-2=9: 3x=11, x=11/3"
      - id: "opt-3"
