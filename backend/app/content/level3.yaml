      - id: "opt-2"
        text: "-3x + 12"
        misconception_id: "DIST_NEG_SIGN"
        note: "Sign error on second term"
      - id: "opt-3"
        text: "3x - 12"
        misconception_id: "DIST_NEG_SIGN"
        note: "Sign error on first term"
      - id: "opt-4"
        text: "3x + 12"
        misconception_id: "DIST_NEG_SIGN"
        note: "Both signs flipped"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral"
    correct_option_id: "opt-1"
    explanation: "-3(x + 4) = -3x - 12. A negative times a positive is negative."
    targets: ["DIST_NEG_SIGN"]

  - item_id: "practice-3-04"
    level: 3
    skill: "distributive-inverse"
    kind: "practice"
    prompt: "Solve 2(x - 4) = 10."
    options:
      - id: "opt-1"
        text: "x = 9"
        misconception_id: null
        note: "Correct: 2x-8=10, 2x=18, x=9"
      - id: "opt-2"
        text: "x = 7"
        misconception_id: "DIST_PARTIAL"
        note: "From 2x-4=10: 2x=14, x=7"
      - id: "opt-3"
        text: "x = 5"
        misconception_id: "INV_WRONG_OP"
        note: "10/2=5, then added 4"
      - id: "opt-4"
        text: "x = 1"
        misconception_id: "INV_ORDER"
        note: "Subtracted 4 first: 2x=6, x=3? unclear"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral"
    correct_option_id: "opt-1"
    explanation: "Expand: 2x - 8 = 10. Add 8: 2x = 18. Divide by 2: x = 9."
    targets: ["DIST_PARTIAL", "INV_WRONG_OP", "INV_ORDER"]

  - item_id: "practice-3-05"
    level: 3
    skill: "distributive-inverse"
    kind: "practice"
    prompt: "A garden has length (x + 6) meters and width 5 meters. Its area is 40 m². Find x."
    options:
      - id: "opt-1"
        text: "x = 2"
        misconception_id: null
        note: "Correct: 5(x+6)=40, 5x+30=40, 5x=10, x=2"
      - id: "opt-2"
        text: "x = 8"
        misconception_id: "DIST_PARTIAL"
        note: "5x+6=40, 5x=34, x=6.8≈8"
      - id: "opt-3"
        text: "x = 4"
        misconception_id: "INV_WRONG_OP"
        note: "40/5=8, then added 6: 14? unclear"
      - id: "opt-4"
        text: "x = 14"
        misconception_id: "INV_ORDER"
        note: "Subtracted 6 from 40 first: 34/5=6.8"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral"
    correct_option_id: "opt-1"
    explanation: "Area = 5(x + 6) = 5x + 30 = 40. Subtract 30: 5x = 10. Divide by 5: x = 2."
    targets: ["DIST_PARTIAL", "INV_WRONG_OP", "INV_ORDER"]

  - item_id: "practice-3-06"
    level: 3
    skill: "distributive-inverse"
    kind: "practice"
    prompt: "Solve -2(x - 3) = 8."
    options:
      - id: "opt-1"
        text: "x = -1"
        misconception_id: null
        note: "Correct: -2x+6=8, -2x=2, x=-1"
      - id: "opt-2"
        text: "x = 5"
        misconception_id: "DIST_NEG_SIGN"
        note: "-2x-6=8, -2x=14, x=-7? or -2x-3=8"
      - id: "opt-3"
        text: "x = -5"
        misconception_id: "INV_NEG_DIV"
        note: "-2x+6=8, -2x=2, x=-1 but sign flipped"
      - id: "opt-4"
        text: "x = 1"
        misconception_id: "INV_NEG_DIV"
        note: "Divided by 2 instead of -2"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral"
    correct_option_id: "opt-1"
    explanation: "-2(x - 3) = -2x + 6 = 8. Subtract 6: -2x = 2. Divide by -2: x = -1."
    targets: ["DIST_NEG_SIGN", "INV_NEG_DIV"]

  # RETEST ITEMS (disjoint from diagnostic/practice/followup/check)
