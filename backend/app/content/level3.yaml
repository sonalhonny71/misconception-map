      - id: "opt-3"
        text: "4x - 12"
        misconception_id: "DIST_NEG_SIGN"
        note: "First term sign flipped"
      - id: "opt-4"
        text: "4x + 12"
        misconception_id: "DIST_NEG_SIGN"
        note: "Both signs flipped"
      - id: "opt-5"
