# Level 3: Algebra Essentials — Distributive Property & Inverse Operations
items:
  - item_id: "diag-3-dist-01"
    level: 3
    skill: "distributive-inverse"
    kind: "diagnostic"
    prompt: "Rewrite 3(x + 2) = 15 without brackets."
    options:
      - id: "opt-1"
        text: "3x + 6 = 15"
        misconception_id: null
        note: "Correct: distribute 3 to both terms"
      - id: "opt-2"
        text: "3x + 2 = 15"
        misconception_id: "DIST_PARTIAL"
        note: "Multiplier applied only to first term"
      - id: "opt-3"
        text: "x + 6 = 15"
        misconception_id: "DIST_PARTIAL"
        note: "Multiplier dropped from first term"
      - id: "opt-4"
        text: "5x = 15"
        misconception_id: "LIKE_UNLIKE"
        note: "Combined 3x and 2 as like terms"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "To remove brackets, multiply the outside number by every term inside: 3 × x = 3x and 3 × 2 = 6. So 3(x + 2) becomes 3x + 6."
    discriminates: ["DIST_PARTIAL", "LIKE_UNLIKE"]

  - item_id: "diag-3-dist-02"
    level: 3
    skill: "distributive-inverse"
    kind: "diagnostic"
    prompt: "Solve 3(x + 2) = 15."
    options:
      - id: "opt-1"
        text: "x = 3"
        misconception_id: null
        note: "Correct: 3x+6=15, 3x=9, x=3"
      - id: "opt-2"
        text: "x = 13/3"
        misconception_id: "DIST_PARTIAL"
        note: "From 3x+2=15: 3x=13, x=13/3"
      - id: "opt-3"
        text: "x = 5/3"
        misconception_id: "LIKE_UNLIKE"
        note: "From 3x+6=15, combined 3x+6=9x: 9x=15, x=5/3"
      - id: "opt-4"
        text: "x = 7"
        misconception_id: "INV_WRONG_OP"
        note: "15/3=5, then added 2 instead of subtracting"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "First expand: 3x + 6 = 15. Subtract 6 from both sides: 3x = 9. Divide by 3: x = 3."
    discriminates: ["DIST_PARTIAL", "LIKE_UNLIKE", "INV_WRONG_OP"]

  - item_id: "diag-3-neg-dist-01"
    level: 3
    skill: "distributive-inverse"
    kind: "diagnostic"
    prompt: "Expand -2(x - 5)."
    options:
      - id: "opt-1"
        text: "-2x + 10"
        misconception_id: null
        note: "Correct: -2 × x = -2x, -2 × -5 = +10"
      - id: "opt-2"
        text: "-2x - 10"
        misconception_id: "DIST_NEG_SIGN"
        note: "Negative times negative treated as negative"
      - id: "opt-3"
        text: "2x - 10"
        misconception_id: "DIST_NEG_SIGN"
        note: "Sign errors on both terms"
      - id: "opt-4"
        text: "2x + 10"
        misconception_id: "DIST_NEG_SIGN"
        note: "Both signs flipped incorrectly"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Multiply -2 by each term: -2 × x = -2x, and -2 × -5 = +10 (negative times negative is positive)."
    discriminates: ["DIST_NEG_SIGN"]

  - item_id: "diag-3-inv-01"
    level: 3
    skill: "distributive-inverse"
    kind: "diagnostic"
    prompt: "Solve x + 7 = 12."
    options:
      - id: "opt-1"
        text: "x = 5"
        misconception_id: null
        note: "Correct: subtract 7 from both sides"
      - id: "opt-2"
        text: "x = 19"
        misconception_id: "INV_WRONG_OP"
        note: "Added 7 instead of subtracting"
      - id: "opt-3"
        text: "x = -5"
        misconception_id: "INV_WRONG_OP"
        note: "Subtracted 12 from 7"
      - id: "opt-4"
        text: "x = 84"
        misconception_id: "INV_WRONG_OP"
        note: "Multiplied instead of using inverse"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "To undo +7, subtract 7 from both sides: x = 12 - 7 = 5."
    discriminates: ["INV_WRONG_OP"]

  # FOLLOW-UP ITEMS (discriminating)
  - item_id: "followup-3-dist-01"
    level: 3
    skill: "distributive-inverse"
    kind: "followup"
    prompt: "If x = 4, which expression has the same value as 3(x + 2)?"
    options:
      - id: "opt-1"
        text: "3x + 6"
        misconception_id: null
        note: "Correct: 3(4+2)=18, 3×4+6=18"
      - id: "opt-2"
        text: "3x + 2"
        misconception_id: "DIST_PARTIAL"
        note: "3×4+2=14 ≠ 18"
      - id: "opt-3"
        text: "x + 6"
        misconception_id: "DIST_PARTIAL"
        note: "4+6=10 ≠ 18"
      - id: "opt-4"
        text: "5x"
        misconception_id: "LIKE_UNLIKE"
        note: "5×4=20 ≠ 18"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Substitute x = 4: 3(4 + 2) = 3(6) = 18. Check each option: 3x + 6 = 3(4) + 6 = 18. The others give different values."
    discriminates: ["DIST_PARTIAL", "LIKE_UNLIKE"]

  - item_id: "followup-3-dist-02"
    level: 3
    skill: "distributive-inverse"
    kind: "followup"
    prompt: "Which expression is equivalent to 4(x + 3)?"
    options:
      - id: "opt-1"
        text: "4x + 12"
        misconception_id: null
        note: "Correct: distribute 4 to both terms"
      - id: "opt-2"
        text: "4x + 3"
        misconception_id: "DIST_PARTIAL"
        note: "Only first term multiplied"
      - id: "opt-3"
        text: "x + 12"
        misconception_id: "DIST_PARTIAL"
        note: "Multiplier dropped from first term"
      - id: "opt-4"
        text: "7x"
        misconception_id: "LIKE_UNLIKE"
        note: "4x and 3 combined as like terms"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "4(x + 3) = 4x + 12. The 4 multiplies both x and 3."
    discriminates: ["DIST_PARTIAL", "LIKE_UNLIKE"]

  - item_id: "followup-3-neg-dist-01"
    level: 3
    skill: "distributive-inverse"
    kind: "followup"
    prompt: "If x = 3, which expression equals -3(x - 2)?"
    options:
      - id: "opt-1"
        text: "-3x + 6"
        misconception_id: null
        note: "Correct: -3(3-2)=-3, -3×3+6=-3"
      - id: "opt-2"
        text: "-3x - 6"
        misconception_id: "DIST_NEG_SIGN"
        note: "-3×3-6=-15 ≠ -3"
      - id: "opt-3"
        text: "3x - 6"
        misconception_id: "DIST_NEG_SIGN"
        note: "3×3-6=3 ≠ -3"
      - id: "opt-4"
        text: "3x + 6"
        misconception_id: "DIST_NEG_SIGN"
        note: "3×3+6=15 ≠ -3"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "-3(x - 2) = -3x + 6. Substitute x = 3: -3(1) = -3, and -3(3) + 6 = -9 + 6 = -3."
    discriminates: ["DIST_NEG_SIGN"]

  - item_id: "followup-3-inv-01"
    level: 3
    skill: "distributive-inverse"
    kind: "followup"
    prompt: "Solve x + 2 = 5."
    options:
      - id: "opt-1"
        text: "x = 3"
        misconception_id: null
        note: "Correct: subtract 2 from both sides"
      - id: "opt-2"
        text: "x = 7"
        misconception_id: "INV_WRONG_OP"
        note: "Added 2 instead of subtracting"
      - id: "opt-3"
        text: "x = -3"
        misconception_id: "INV_WRONG_OP"
        note: "Subtracted 5 from 2"
      - id: "opt-4"
        text: "x = 10"
        misconception_id: "INV_WRONG_OP"
        note: "Multiplied 5 by 2"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "To undo +2, subtract 2 from both sides: x = 5 - 2 = 3."
    discriminates: ["INV_WRONG_OP"]

  # CHECK UNDERSTANDING (transfer questions for all-correct diagnostic)
  - item_id: "check-3-01"
    level: 3
    skill: "distributive-inverse"
    kind: "check"
    prompt: "A rectangle has length (x + 5) and width 4. Write an expression for its area."
    options:
      - id: "opt-1"
        text: "4x + 20"
        misconception_id: null
        note: "Correct: area = 4(x+5) = 4x+20"
      - id: "opt-2"
        text: "4x + 5"
        misconception_id: "DIST_PARTIAL"
        note: "Partial distribution"
      - id: "opt-3"
        text: "x + 20"
        misconception_id: "DIST_PARTIAL"
        note: "Multiplier dropped"
      - id: "opt-4"
        text: "9x"
        misconception_id: "LIKE_UNLIKE"
        note: "Combined 4x and 5"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Area = length × width = 4(x + 5) = 4x + 20."
    discriminates: ["DIST_PARTIAL", "LIKE_UNLIKE"]

  - item_id: "check-3-02"
    level: 3
    skill: "distributive-inverse"
    kind: "check"
    prompt: "Which equation has the solution x = 2?"
    options:
      - id: "opt-1"
        text: "3(x - 1) = 3"
        misconception_id: null
        note: "Correct: 3(2-1)=3"
      - id: "opt-2"
        text: "2(x + 3) = 8"
        misconception_id: "DIST_PARTIAL"
        note: "2(2+3)=10 ≠ 8"
      - id: "opt-3"
        text: "x + 6 = 10"
        misconception_id: null
        note: "2+6=8 ≠ 10"
      - id: "opt-4"
        text: "4x - 2 = 4"
        misconception_id: null
        note: "4×2-2=6 ≠ 4"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Check x = 2 in each: 3(2 - 1) = 3(1) = 3 ✓"
    discriminates: ["DIST_PARTIAL"]

  # PRACTICE ITEMS (6+ items, different forms)
  - item_id: "practice-3-01"
    level: 3
    skill: "distributive-inverse"
    kind: "practice"
    prompt: "Expand 4(x + 5)."
    options:
      - id: "opt-1"
        text: "4x + 20"
