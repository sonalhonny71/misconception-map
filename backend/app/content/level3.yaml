        note: "Correct"
      - id: "opt-2"
        text: "4x + 5"
        misconception_id: "DIST_PARTIAL"
        note: "Partial distribution"
      - id: "opt-3"
        text: "x + 20"
        misconception_id: "DIST_PARTIAL"
        note: "Multiplier dropped"
      - id: "opt-4"
        text: "9x"
        misconception_id: "LIKE_UNLIKE"
        note: "Combined unlike terms"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral"
    correct_option_id: "opt-1"
    explanation: "4(x + 5) = 4x + 20. Multiply 4 by both x and 5."
    targets: ["DIST_PARTIAL", "LIKE_UNLIKE"]

  - item_id: "practice-3-02"
