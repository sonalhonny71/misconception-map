    explanation: "3(x - 2) = 3x - 6 = 9. Add 6: 3x = 15. Divide by 3: x = 5."
    discriminates: ["DIST_PARTIAL", "INV_WRONG_OP", "INV_ORDER"]

  - item_id: "retest-3-05"
    level: 3
    skill: "distributive-inverse"
    kind: "retest"
    prompt: "If y = 2(x + 3), what is y when x = 5?"
