        note: "2×5+3=13"
      - id: "opt-3"
        text: "8"
        misconception_id: "DIST_PARTIAL"
        note: "5+3=8, forgot to multiply by 2"
      - id: "opt-4"
        text: "10"
        misconception_id: "LIKE_UNLIKE"
        note: "2×5=10, ignored +3"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
