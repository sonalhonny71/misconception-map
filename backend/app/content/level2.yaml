      - id: "opt-2"
        text: "-2y"
        misconception_id: "LIKE_NEG_COEFF"
        note: "Subtracted: -4 - (-2) = -2"
      - id: "opt-3"
        text: "6y"
        misconception_id: "LIKE_NEG_COEFF"
        note: "Two negatives make positive"
      - id: "opt-4"
        text: "-8y"
        misconception_id: "LIKE_NEG_COEFF"
        note: "Multiplied: -4 × -2 = 8? unclear"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Add the coefficients: -4 + (-2) = -6. So -4y + (-2y) = -6y."
    discriminates: ["LIKE_NEG_COEFF"]

  - item_id: "followup-2-subst-01"
    level: 2
    skill: "expressions-like-terms"
    kind: "followup"
    prompt: "If y = 5, evaluate 3y - 2."
    options:
      - id: "opt-1"
        text: "13"
        misconception_id: null
        note: "Correct: 3×5-2=15-2=13"
      - id: "opt-2"
        text: "17"
        misconception_id: "SUBST_ORDER"
        note: "3×5=15, then 15+2=17 (added instead of subtracted)"
      - id: "opt-3"
        text: "3"
        misconception_id: "SUBST_ORDER"
        note: "5-2=3, forgot to multiply by 3"
      - id: "opt-4"
        text: "15"
        misconception_id: "SUBST_ORDER"
        note: "3×5=15, ignored -2"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Substitute y = 5: 3 × 5 - 2 = 15 - 2 = 13."
    discriminates: ["SUBST_ORDER"]

  # CHECK UNDERSTANDING
  - item_id: "check-2-01"
    level: 2
    skill: "expressions-like-terms"
    kind: "check"
    prompt: "A rectangle has width x and length x + 4. Write an expression for its perimeter."
    options:
      - id: "opt-1"
        text: "4x + 8"
        misconception_id: null
        note: "Correct: P = 2(x + x + 4) = 4x + 8"
      - id: "opt-2"
        text: "2x + 4"
        misconception_id: "LIKE_UNLIKE"
        note: "Forgot to multiply by 2: x + x + 4"
      - id: "opt-3"
        text: "x + 4"
        misconception_id: "LIKE_UNLIKE"
        note: "Only one side"
      - id: "opt-4"
        text: "4x"
        misconception_id: "LIKE_UNLIKE"
        note: "Dropped constant"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Perimeter = 2 × (width + length) = 2 × (x + x + 4) = 2 × (2x + 4) = 4x + 8."
    discriminates: ["LIKE_UNLIKE"]

  - item_id: "check-2-02"
    level: 2
