# Level 2: Expressions — Expressions & Like Terms
items:
  - item_id: "diag-2-like-01"
    level: 2
    skill: "expressions-like-terms"
    kind: "diagnostic"
    prompt: "Simplify 3x + 5x - 2."
    options:
      - id: "opt-1"
        text: "8x - 2"
        misconception_id: null
        note: "Correct: 3x and 5x are like terms"
      - id: "opt-2"
        text: "3x + 3"
        misconception_id: "LIKE_UNLIKE"
        note: "Combined 5x and -2 as like terms"
      - id: "opt-3"
        text: "5x - 2"
        misconception_id: "LIKE_UNLIKE"
        note: "Dropped 3x term"
      - id: "opt-4"
        text: "8x"
        misconception_id: "LIKE_UNLIKE"
        note: "Dropped constant -2"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "3x and 5x are like terms (both have x), so 3x + 5x = 8x. The -2 is a constant and stays separate: 8x - 2."
    discriminates: ["LIKE_UNLIKE"]

  - item_id: "diag-2-subst-01"
    level: 2
    skill: "expressions-like-terms"
    kind: "diagnostic"
    prompt: "If x = 4, evaluate 2x + 3."
    options:
      - id: "opt-1"
        text: "11"
        misconception_id: null
        note: "Correct: 2 × 4 + 3 = 11"
      - id: "opt-2"
        text: "8"
        misconception_id: "SUBST_ORDER"
        note: "2 + 3 = 5, then... unclear"
      - id: "opt-3"
        text: "5"
        misconception_id: "SUBST_ORDER"
        note: "Forgot to multiply: 4 + 3 = 7? or 2+3=5"
      - id: "opt-4"
        text: "14"
        misconception_id: "SUBST_ORDER"
        note: "2 × 4 = 8, then 8 × 3? or 2×7=14"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Replace x with 4: 2 × 4 + 3 = 8 + 3 = 11. Multiply before adding."
    discriminates: ["SUBST_ORDER"]

  - item_id: "diag-2-neg-like-01"
    level: 2
    skill: "expressions-like-terms"
    kind: "diagnostic"
    prompt: "Simplify -2x + (-3x)."
    options:
      - id: "opt-1"
        text: "-5x"
        misconception_id: null
        note: "Correct: -2 + (-3) = -5"
      - id: "opt-2"
        text: "-6x"
        misconception_id: "LIKE_NEG_COEFF"
        note: "Multiplied coefficients: -2 × -3 = 6, but sign?"
      - id: "opt-3"
        text: "5x"
        misconception_id: "LIKE_NEG_COEFF"
        note: "Two negatives make positive"
      - id: "opt-4"
        text: "-x"
        misconception_id: "LIKE_NEG_COEFF"
        note: "Subtracted: -2 - (-3) = 1? or confused"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "Add the coefficients: -2 + (-3) = -5. So -2x + (-3x) = -5x."
    discriminates: ["LIKE_NEG_COEFF"]

  - item_id: "diag-2-like-02"
    level: 2
    skill: "expressions-like-terms"
    kind: "diagnostic"
    prompt: "Simplify 4y - 2y + 7."
    options:
      - id: "opt-1"
        text: "2y + 7"
        misconception_id: null
        note: "Correct: 4y - 2y = 2y"
      - id: "opt-2"
        text: "2y"
        misconception_id: "LIKE_UNLIKE"
        note: "Dropped constant 7"
      - id: "opt-3"
        text: "6y + 7"
        misconception_id: "LIKE_UNLIKE"
        note: "Added instead of subtracting: 4y + 2y = 6y"
      - id: "opt-4"
        text: "9y"
        misconception_id: "LIKE_UNLIKE"
        note: "Combined all terms: 4+2+7=13? unclear"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "4y - 2y = 2y. The constant 7 stays: 2y + 7."
    discriminates: ["LIKE_UNLIKE"]

  # FOLLOW-UP ITEMS
  - item_id: "followup-2-like-01"
    level: 2
    skill: "expressions-like-terms"
    kind: "followup"
    prompt: "If x = 3, which expression equals 2x + 5x?"
    options:
      - id: "opt-1"
        text: "21"
        misconception_id: null
        note: "Correct: 2×3+5×3=6+15=21"
      - id: "opt-2"
        text: "11"
        misconception_id: "LIKE_UNLIKE"
        note: "2×3+5=11 (didn't multiply second term)"
      - id: "opt-3"
        text: "8"
        misconception_id: "LIKE_UNLIKE"
        note: "2+5=7? or 2×3=6+5=11? unclear"
      - id: "opt-4"
        text: "15"
        misconception_id: "SUBST_ORDER"
        note: "5×3=15, ignored first term"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "2x + 5x = 7x. When x = 3: 7 × 3 = 21."
    discriminates: ["LIKE_UNLIKE", "SUBST_ORDER"]

  - item_id: "followup-2-neg-01"
