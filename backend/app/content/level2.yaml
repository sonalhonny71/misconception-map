        misconception_id: "SUBST_ORDER"
        note: "5×2+3=13"
      - id: "opt-3"
        text: "10"
        misconception_id: "SUBST_ORDER"
        note: "5×2=10, ignored second term"
      - id: "opt-4"
        text: "8"
        misconception_id: "LIKE_UNLIKE"
        note: "5+3=8, forgot to multiply by a"
      - id: "opt-5"
        text: "I'm not sure yet"
        misconception_id: null
        note: "Neutral response"
    correct_option_id: "opt-1"
    explanation: "5a + 3a = 8a. When a = 2: 8 × 2 = 16."
    discriminates: ["SUBST_ORDER", "LIKE_UNLIKE"]

